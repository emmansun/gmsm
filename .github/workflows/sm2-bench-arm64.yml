name: sm2-bench

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm2-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: SM2 benchmark (arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Get CPU info
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "=== CPU Information ==="
            uname -a
            echo ""
            echo "=== Processor Details ==="
            lscpu || true
            echo ""
            echo "=== /proc/cpuinfo ==="
            cat /proc/cpuinfo || true
          } | tee artifacts/cpu-info.txt

      - name: Run sm2 benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          go test -run '^$' -bench . -benchmem -benchtime=300ms ./sm2 | tee artifacts/sm2-bench.txt

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sm2-bench-${{ github.run_id }}
          path: artifacts/
