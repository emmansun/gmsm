name: ci

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goVer: ['1.26', '1.27']
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.goVer }}
       
    - name: Test with Coverage
      if: ${{ matrix.goVer == '1.26' }}
      run: go test -coverpkg=./... -v -short -race -coverprofile=coverage1.txt -covermode=atomic ./...

    - name: Test Generic with Coverage
      if: ${{ matrix.goVer == '1.26' }}
      run: go test -coverpkg=./... -v -short -tags purego  -coverprofile=coverage2.txt -covermode=atomic ./...      

    - name: Upload coverage to Codecov
      if: ${{ matrix.goVer == '1.26' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage1.txt,./coverage2.txt
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  
    - name: Test Force SM4 Single Block with AES-NI
      run: go test -short ./sm4/...      
      env:
        FORCE_SM4BLOCK_AESNI: 1

    - name: Differential tests (required native kernels)
      # Every GitHub-hosted amd64 runner has AES-NI, PCLMULQDQ and AVX2, so
      # the AES-block, ZUC, GCMSIV-POLYVAL, ML-KEM and ML-DSA asm kernels
      # must engage; the diff suites fail via DIFF_REQUIRE if the dispatch
      # silently falls back.
      run: go test -short -run 'TestDiff|FuzzDiff' ./internal/sm4/ ./internal/sm3/ ./internal/zuc/ ./internal/cipher/xts/ ./internal/cipher/gcmsiv/ ./mlkem/ ./mldsa/
      env:
        DIFF_REQUIRE: aes,zuc-eea,zuc-eia,gcmsiv-polyval,mlkem-avx2,mldsa-avx2

    - name: Differential tests (alternate dispatch state)
      # Rerun in a separate process with the env knobs forcing the
      # non-default dispatch paths (see internal/sm4/diff_test.go).
      run: go test -short -run 'TestDiff|FuzzDiff' ./internal/sm4/ ./internal/sm3/
      env:
        DISABLE_SM4NI: 1
        DISABLE_GFNI: 1
        FORCE_SM4BLOCK_AESNI: 1

    - name: Test only
      if: ${{ matrix.goVer != '1.26' }}
      run: go test -short ./...

    - name: Test Generic only
      if: ${{ matrix.goVer != '1.26' }}
      run: go test -short -tags purego ./...      

    - name: Test Plugin only
      if: ${{ matrix.goVer == '1.26' }}
      run: go test -short -tags plugin ./...      

  smx509-patch-consistency:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'

    - name: Regenerate patches and check consistency
      run: |
        go run scripts/smx509/gen_patches.go
        if ! git diff --exit-code scripts/smx509/patches/; then
          echo "::error::smx509 source patches are out of sync! Run 'go run scripts/smx509/gen_patches.go' locally and commit the result."
          exit 1
        fi
        go run scripts/smx509/gen_test_patches.go
        if ! git diff --exit-code scripts/smx509/test-patches/; then
          echo "::error::smx509 test patches are out of sync! Run 'go run scripts/smx509/gen_test_patches.go' locally and commit the result."
          exit 1
        fi
