
# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: riscv64-zvbc

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:

  test:
    strategy:
      matrix:
        goVer: [1.27]
        arch: [riscv64]
        vlen: [128, 256, 512]

    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ matrix.goVer }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Verify Zvksed/Zvksh are visible to QEMU
      run: |
        QEMU_CPU=max sh -c 'true'
        echo "QEMU_CPU=max (default for riscv64 linux-user since QEMU 8.1)"

    - name: Verify QEMU RVV configuration
      run: |
        echo "QEMU_CPU=${QEMU_CPU}"
        go test -v -count=1 ./internal/... \
          -run '^TestRVVConfiguredVLEN$'
      env:
        GOARCH: ${{ matrix.arch }}
        EXPECTED_VLEN: ${{ matrix.vlen }}
        QEMU_CPU: max,v=true,vlen=${{ matrix.vlen }},elen=64

    - name: Test without Zvkg
      run: go test -v -short ./internal/... ./sm3/... ./sm4/... ./mlkem/... ./mldsa/...
      env:
        DISABLE_GHASH: 1
        QEMU_CPU: max,v=true,vlen=${{ matrix.vlen }},elen=64
        GOARCH: ${{ matrix.arch }}

    - name: Test Cipher without Zvkg
      run: go test -v -short ./cipher -run 'TestXTS|TestGBXTSSample|TestXTSBoundaryLengths|TestGBXTS|TestGCMSIV|TestNewGCMSIV'
      env:
        DISABLE_GHASH: 1
        QEMU_CPU: max,v=true,vlen=${{ matrix.vlen }},elen=64
        GOARCH: ${{ matrix.arch }}
