name: Update License File
on:
  push:
    branches: [ "develop" ]
    paths:
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.25'
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Generate license files
        run: |
          go-licenses report github.com/emmansun/gmsm > third-party-licenses.md
